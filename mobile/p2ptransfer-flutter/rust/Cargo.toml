[package]
name = "rust_lib_p2ptransfer"
version = "0.1.0"
edition = "2021"
description = "flutter_rust_bridge Rust side for p2ptransfer mobile"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
p2ptransfer-core = { path = "../../../p2ptransfer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
flutter_rust_bridge = "=2.12.0"
iroh = "1.0.2"
iroh-blobs = "0.103.0"
lazy_static = "1.5.0"
rand.workspace = true
